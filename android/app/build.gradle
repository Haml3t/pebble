plugins {
    id 'com.android.application'
}

android {
    namespace 'com.dsugarman.glance'
    compileSdk 34

    defaultConfig {
        applicationId "com.dsugarman.glance"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "0.1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'com.getpebble:pebblekit:4.0.1@aar'
}
